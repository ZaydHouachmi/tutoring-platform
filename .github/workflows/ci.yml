name: CI

# Every push and every pull request. The point is to find out here rather than
# from a family who cannot book.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Last, because it is the slowest and the others localise a failure
      # faster. Supabase and Resend keys are absent here on purpose: the build
      # must not require them.
      - name: Build
        run: npm run build
